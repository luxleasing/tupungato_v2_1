<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Visor GIS municipal de activos urbanos: luminarias.">
    <title>Lux Leasing — Monitoreo de Luminarias</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="text/tailwindcss">
        @custom-variant dark (&:where(.dark, .dark *));
    </script>
    <link href="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <base target="_blank">
</head>

<body class="bg-slate-50 dark:bg-[#030712] text-slate-900 dark:text-slate-100 h-screen flex flex-col overflow-hidden transition-colors duration-300">

<!-- ══════════════════════ ENCABEZADO ══════════════════════ -->
<header id="main-header" class="w-full z-20 relative transition-colors duration-300">

    <!-- Fila superior: logos, título, controles -->
    <div class="w-full flex items-center justify-between px-4 h-[46px] border-b border-white/[0.06] relative gap-3">
        <div class="flex items-center gap-3 shrink-0">
            <a id="brand-lux" href="#" rel="noopener noreferrer" class="flex items-center">
                <img src="logo_lux_byn.png" alt="Logo Lux" class="h-9 w-auto object-contain opacity-70 hover:opacity-100 transition-opacity" onerror="this.style.display='none';">
            </a>
            <div class="h-6 border-l border-dotted border-white/20"></div>
            <a id="brand-municipio" href="#" rel="noopener noreferrer" class="flex items-center">
                <img src="logo_tupungato.png" alt="Logo municipio" class="h-7 w-auto object-contain opacity-70 hover:opacity-100 transition-opacity" onerror="this.style.display='none';">
            </a>
        </div>

        <h1 class="absolute left-1/2 -translate-x-1/2 text-[12px] font-semibold text-slate-100 tracking-[0.02em] whitespace-nowrap pointer-events-none hidden xl:block">
            Monitoreo de Luminarias
        </h1>

        <div class="flex flex-col items-end shrink-0">
            <div class="flex items-center bg-white/[0.04] border border-white/10 rounded-md overflow-hidden h-[28px]">

                <!-- Botón ☰ para abrir la ficha técnica en mobile -->
                <button id="btn-toggle-sidebar"
                        class="hidden max-[900px]:flex px-2 h-full border-r border-white/10 hover:bg-white/10 text-slate-400 hover:text-slate-100 transition-colors cursor-pointer items-center justify-center"
                        title="Ver ficha técnica">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>

                <select id="map-style-select" class="bg-transparent border-0 text-[11px] py-1 pl-2.5 pr-1 focus:outline-none text-slate-200 font-medium cursor-pointer h-full">
                    <option value="light">Modo Claro</option>
                    <option value="dark">Modo Oscuro</option>
                    <option value="satellite">Mapa Base Satelital</option>
                </select>
                <button id="theme-toggle" aria-label="Cambiar tema" title="Cambiar tema"
                        class="px-2 h-full border-l border-white/10 hover:bg-white/10 text-slate-400 hover:text-slate-100 transition-colors cursor-pointer flex items-center justify-center">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                        <circle cx="12" cy="12" r="7"></circle>
                        <path d="M12 5a7 7 0 0 0 0 14V5z" fill="currentColor" stroke="none"></path>
                    </svg>
                </button>
            </div>
            <div class="text-[8.5px] text-slate-500 mt-0.5 whitespace-nowrap">
                Fecha actualización: <span id="fecha-ultima-actualizacion">Cargando…</span>
            </div>
        </div>
    </div>

    <!-- Fila inferior: KPIs y herramientas -->
    <div class="w-full flex items-stretch justify-center h-[46px]">

        <button id="btn-mod-todos" class="kpi-module" aria-pressed="true">
            <span class="kpi-label">Todas</span>
        </button>

        <!-- Luminarias -->
        <div class="kpi-module-wrap">
            <button id="btn-mod-luminarias" class="kpi-module" aria-pressed="true">
                <span id="kpi-total" class="kpi-number">0</span>
                <span class="kpi-label">Luminarias</span>
            </button>
            <div id="drop-luminarias" class="dropdown-content absolute top-full left-1/2 -translate-x-1/2 mt-1 w-52 bg-[#0b1528] border border-white/10 rounded-xl shadow-xl p-3 hidden z-50">
                <h3 class="dropdown-title">Tecnología</h3>
                <div class="space-y-2">
                    <button type="button" data-lum-category="LED" class="lum-category w-full flex justify-between items-center text-xs rounded-md px-1 py-1 border border-transparent hover:border-cyan-400/60 transition-colors">
                        <span class="flex items-center gap-1.5 text-slate-300"><span class="w-2 h-2 rounded-full" data-sym="luminarias:LED"></span> LED</span>
                        <span id="kpi-led" class="font-bold text-cyan-400">0%</span>
                    </button>
                    <button type="button" data-lum-category="SAP" class="lum-category w-full flex justify-between items-center text-xs rounded-md px-1 py-1 border border-transparent hover:border-orange-400/60 transition-colors">
                        <span class="flex items-center gap-1.5 text-slate-300"><span class="w-2 h-2 rounded-full" data-sym="luminarias:SAP"></span> SAP</span>
                        <span id="kpi-sap" class="font-bold text-orange-400">0%</span>
                    </button>
                    <button type="button" data-lum-category="OTROS" class="lum-category w-full flex justify-between items-center text-xs rounded-md px-1 py-1 border border-transparent hover:border-slate-400/60 transition-colors">
                        <span class="flex items-center gap-1.5 text-slate-300"><span class="w-2 h-2 rounded-full" data-sym="luminarias:OTROS"></span> Otros</span>
                        <span id="kpi-lum-otros" class="font-bold text-slate-400">0%</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Filtros -->
        <div class="kpi-module-wrap flex items-center px-3">
            <select id="filtro-distrito" class="bg-white/[0.04] border border-white/10 rounded-md text-[10.5px] text-slate-300 h-[28px] px-2 focus:outline-none cursor-pointer min-w-[140px] uppercase font-semibold tracking-wide">
                <option value="Todos">Distrito</option>
            </select>
            <button id="btn-bbox-select" class="ml-2 w-7 h-7 flex items-center justify-center rounded-md bg-white/[0.04] border border-white/10 text-slate-400 hover:text-slate-100 hover:bg-white/10 transition-colors cursor-pointer" title="Dibujar zona de selección (clic para marcar vértices)">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path stroke-dasharray="3 2" stroke-linecap="round" d="M4 4h16v16H4z"></path>
                </svg>
            </button>
            <button id="btn-stats" class="ml-2 w-7 h-7 flex items-center justify-center rounded-md bg-white/[0.04] border border-white/10 text-slate-400 hover:text-slate-100 hover:bg-white/10 transition-colors cursor-pointer" title="Estadísticas">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
            </button>
        </div>
    </div>
</header>

<!-- ══════════════════════ CUERPO ══════════════════════ -->
<div class="flex flex-1 overflow-hidden relative w-full">

    <!-- Ficha técnica -->
    <aside id="technical-sidebar" class="w-80 flex flex-col h-full shadow-lg z-10">
        <div class="p-4 pb-2 border-b flex items-center justify-between">
            <h3 class="text-[11px] font-semibold uppercase tracking-[0.08em]">Ficha Técnica</h3>
        </div>

        <div class="p-4 flex-1 overflow-y-auto sidebar-scroll">
            <div class="space-y-3">

                <!-- Buscador + coordenadas -->
                <div class="p-3 border-b space-y-2">
                    <div id="osm-search-box" class="relative">
                        <input id="osm-search-input" type="text" autocomplete="off"
                               placeholder="Buscar calle, lugar…"
                               class="osm-search-input">
                        <svg class="w-3.5 h-3.5 absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <circle cx="11" cy="11" r="7"></circle><path stroke-linecap="round" d="M21 21l-4.3-4.3"></path>
                        </svg>
                        <div id="osm-search-results" class="hidden absolute top-full left-0 right-0 mt-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-[#0b1528] shadow-xl overflow-hidden z-50 max-h-64 overflow-y-auto"></div>
                    </div>
                    <div class="flex items-center gap-2 text-[10px] text-slate-500 dark:text-slate-400 tabular-nums">
                        <span class="inline-flex items-center gap-1" title="Coordenada seleccionada">
                            <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 21c-4.5-4.1-7-7.6-7-10.5A7 7 0 0119 10.5C19 13.4 16.5 16.9 12 21z"></path>
                                <circle cx="12" cy="10.5" r="2.5"></circle>
                            </svg>
                            <span id="coords-click-value" class="font-semibold whitespace-nowrap">— · —</span>
                        </span>
                    </div>
                </div>

                <!-- Street View -->
                <div class="sv-card">
                    <div class="sv-card-header">
                        <span>Google Street View</span>
                        <a id="btn-sv-external" href="#">Abrir</a>
                    </div>
                    <div class="w-full h-56 bg-[#e0e0e0] relative">
                        <iframe id="street-view-frame" class="w-full h-full hidden border-none" allowfullscreen loading="lazy"></iframe>
                        <div id="sv-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-center p-4">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-slate-500 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 7.5A1.5 1.5 0 014.5 6h2.379a1.5 1.5 0 001.06-.44l.621-.62A1.5 1.5 0 019.621 4.5h4.758a1.5 1.5 0 011.06.44l.621.62A1.5 1.5 0 0017.121 6H19.5A1.5 1.5 0 0121 7.5v9A1.5 1.5 0 0119.5 18h-15A1.5 1.5 0 013 16.5v-9z"/>
                                <circle cx="12" cy="12" r="3.5"/>
                            </svg>
                            <span class="text-xs font-medium text-slate-600">Seleccione un punto del mapa para ver Google Street View.</span>
                        </div>
                    </div>
                </div>

                <!-- Ficha técnica dinámica -->
                <div class="grid grid-cols-2 ficha-grid">
                    <div class="ficha-celda border-b border-r">
                        <span class="ficha-label">ID Elemento</span>
                        <span id="info-id" class="ficha-valor">-</span>
                    </div>
                    <div class="ficha-celda border-b">
                        <span class="ficha-label">Elemento</span>
                        <span id="info-elemento" class="ficha-valor">-</span>
                    </div>
                </div>

                <div id="ficha-primaria" class="grid grid-cols-2 ficha-grid"></div>

                <button id="btn-ver-mas-campos" class="w-full flex items-center justify-between text-[10px] font-semibold uppercase tracking-[0.08em] text-slate-600 hover:text-slate-900 py-1.5 px-1 border-b border-dotted border-slate-300 transition-colors cursor-pointer">
                    <span id="label-ver-mas">Ver más campos</span>
                    <span id="chevron-ver-mas" class="text-slate-400 transition-transform duration-200">▾</span>
                </button>

                <div id="ficha-secundaria" class="hidden grid grid-cols-2 ficha-grid"></div>

                <div class="pt-2">
                    <button id="btn-export-pdf" class="w-full bg-[#1b2a47] hover:bg-[#1f618d] text-white text-[12px] font-bold py-2 px-3 rounded-md shadow transition-colors cursor-pointer">Exportar PDF</button>
                </div>
            </div>
        </div>
    </aside>

    <!-- Mapa + leyenda + barra de filtro -->
    <main class="flex-1 relative h-full">
        <div id="map" class="w-full h-full bg-slate-100 dark:bg-slate-950"></div>

        <div id="bbox-toolbar" class="absolute bottom-5 left-5 z-[35] hidden items-center gap-2 bg-white/95 dark:bg-[#0b1528]/95 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl px-3 py-2 backdrop-blur">
            <span class="text-[10px] font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mr-1">Filtro</span>
            <button id="btn-bbox-apply" class="px-3 py-1.5 text-[11px] font-semibold rounded-md bg-slate-600 hover:bg-slate-500 text-slate-100 transition-colors cursor-pointer">Aplicar filtro</button>
            <button id="btn-bbox-reset" class="px-3 py-1.5 text-[11px] font-semibold rounded-md bg-slate-100 hover:bg-slate-200 dark:bg-slate-700/60 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors cursor-pointer">Restaurar todo</button>
        </div>

        <div id="legend-control" class="absolute bottom-5 right-5 z-20 text-xs">
            <button id="legend-toggle" class="ml-auto flex items-center gap-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white/85 dark:bg-gray-800/85 px-3 py-2 font-semibold text-slate-700 dark:text-slate-200 shadow-lg backdrop-blur hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                Referencias <span id="legend-chevron">▾</span>
            </button>
            <div id="legend-panel" class="hidden mt-2 w-56 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/85 dark:bg-gray-800/85 p-3 shadow-xl backdrop-blur">
                <div class="mb-2 font-bold uppercase tracking-[0.08em] text-[10px] text-slate-500 dark:text-slate-400">Simbología</div>
                <div id="legend-body" class="space-y-2 text-slate-700 dark:text-slate-300"></div>
            </div>
        </div>
    </main>

    <!-- Panel de estadísticas -->
    <aside id="stats-panel" class="absolute right-0 top-0 h-full w-96 shadow-2xl z-40 transform translate-x-full transition-transform duration-300 flex flex-col"
           style="background:var(--stats-bg);border-left:1px solid var(--stats-border);">
        <div class="flex items-center justify-between p-4" style="border-bottom:1px solid var(--stats-border);">
            <h2 class="text-[12px] font-semibold uppercase tracking-[0.08em]" style="color:var(--stats-valor);">Estadísticas</h2>
            <button id="btn-close-stats" class="transition-colors cursor-pointer" style="color:var(--stats-sub);">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <div id="stats-content" class="flex-1 overflow-y-auto text-xs" style="color:var(--stats-valor);"></div>
    </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
